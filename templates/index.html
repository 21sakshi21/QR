<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ QR Engine - Advanced Premium Generator</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at 10% 20%, #f1f5f9 0%, #cbd5e1 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.4s ease;
            font-family: system-ui, -apple-system, sans-serif;
        }

        [data-bs-theme="dark"] body {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
        }
        
        .qr-card {
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            transition: all 0.4s ease;
        }

        [data-bs-theme="dark"] .qr-card {
            background: rgba(15, 23, 42, 0.65);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 50px -10px rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        [data-bs-theme="dark"] .text-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-input {
            background-color: #ffffff !important;
            color: #0f172a !important;
            border: 2px solid #e2e8f0 !important;
            font-weight: 500;
            border-radius: 14px;
        }
        .custom-input:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
        }

        [data-bs-theme="dark"] .custom-input {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border: 2px solid #334155 !important;
        }
        [data-bs-theme="dark"] .custom-input:focus {
            border-color: #818cf8 !important;
            background-color: #0f172a !important;
        }

        .btn-premium {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white !important;
            border: none;
            font-weight: 600;
            border-radius: 14px;
            transition: all 0.3s ease;
        }
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.06);
            display: inline-block;
        }

        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            border-radius: 16px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.4);
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }
        [data-bs-theme="dark"] .theme-toggle {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <button onclick="toggleTheme()" class="theme-toggle" id="themeBtn">
        <i class="bi bi-moon-stars-fill text-primary fs-5" id="themeIcon"></i>
    </button>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card qr-card p-4 p-sm-5">
                    
                    <div class="text-center mb-5">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3" style="width: 64px; height: 64px; background-color: rgba(99, 102, 241, 0.15);">
                            <i class="bi bi-qr-code-scan fs-2 text-primary"></i>
                        </div>
                        <h1 class="display-6 text-gradient mb-1">QR Engine</h1>
                        <p class="text-muted small">Convert web links into beautiful matrix codes</p>
                    </div>

                    <form method="POST" onsubmit="showSpinner()">
                        <div class="mb-4">
                            <label for="url_input" class="form-label text-uppercase font-monospace text-muted small fw-bold mb-2">Destination URL</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text custom-input border-end-0 text-muted"><i class="bi bi-link-45deg"></i></span>
                                <input 
                                    type="url" 
                                    id="url_input" 
                                    name="url_input" 
                                    placeholder="https://yourwebsite.com" 
                                    required 
                                    value="{{ original_url }}"
                                    class="form-control custom-input border-start-0 fs-6"
                                >
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-premium btn-lg w-100 py-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <span>Generate QR Code</span>
                            <i class="bi bi-lightning-charge-fill"></i>
                        </button>

                        <button id="loadingBtn" class="btn btn-secondary btn-lg w-100 py-3 d-none align-items-center justify-content-center" disabled>
                            <span class="spinner-border spinner-border-sm me-2"></span> Mapping Grid...
                        </button>
                    </form>

                    {% if qr_code %}
                        <div class="mt-5 pt-4 border-top text-center">
                            <div class="qr-wrapper mb-4">
                                <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" class="img-fluid" style="max-height: 190px;">
                            </div>
                            <div class="d-grid">
                                <a href="data:image/png;base64,{{ qr_code }}" download="qrcode.png" class="btn btn-success btn-lg py-3 rounded-3 fw-bold shadow-sm">
                                    Download Assets (.PNG)
                                </a>
                            </div>
                        </div>
                    {% endif %}

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        updateToggleStyle(savedTheme);

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', targetTheme);
            localStorage.setItem('theme', targetTheme);
            updateToggleStyle(targetTheme);
        }

        function updateToggleStyle(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.className = 'bi bi-sun-fill text-warning fs-5';
            } else {
                icon.className = 'bi bi-moon-stars-fill text-primary fs-5';
            }
        }

        function showSpinner() {
            const urlInput = document.getElementById('url_input');
            if (urlInput.value.trim() !== "") {
                document.getElementById('submitBtn').classList.add('d-none');
                document.getElementById('loadingBtn').classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
